name: 打包React项目
on: push

permissions:
  contents: write

jobs:
  npm-build:
    name: npm-build工作
    runs-on: ubuntu-latest

    steps:
    - name: 读取仓库内容
      uses: actions/checkout@v4

    - name: 安装依赖 项目打包
      run: |
        npm install
        npm run build
    - name: 部署到宝塔
      uses: wlixcc/SFTP-Deploy-Action@v1.0
      with:
        username: 'root'
        server: ${{ secrets.REMOTE_HOST }}
        ssh_private_key: ${{ secrets.PRIVATE_KEY }}
        local_path: './build/*'
        remote_path: '/www/wwwroot/default/'
